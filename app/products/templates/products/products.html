{% extends 'base.html' %}

{% block content %}
<div class="row g-3">
    {% for product in products %}
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm h-100">
            <div class="card-body d-flex flex-column">
                <h2 class="h5">
                    <a href="{{ url_for('products.detail_product', product_id=product.id) }}">{{ product.name }}</a>
                </h2>
                <p class="flex-grow-1">{{ product.content }}</p>
                <strong>${{ product.price }}</strong>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
