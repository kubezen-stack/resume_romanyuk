{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="section-title">{{ product.name }}</h2>
        <p class="text-muted small">ID: {{ product.id }}</p>
        <p>{{ product.content }}</p>
        <p class="fw-bold">Ціна: ${{ product.price }}</p>
        <a href="{{ url_for('products.products') }}">&larr; Назад до списку</a>
    </div>
</div>
{% endblock %}
